<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 430" role="img" aria-labelledby="title desc">
  <title id="title">NexaTech analytics dashboard illustration</title>
  <desc id="desc">A glowing analytics dashboard with chart bars and floating KPI cards.</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#091827"/>
      <stop offset="52%" stop-color="#13263e"/>
      <stop offset="100%" stop-color="#0e1728"/>
    </linearGradient>
    <linearGradient id="panelGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="600" height="430" rx="32" fill="url(#bgGrad)"/>
  <circle cx="534" cy="354" r="126" fill="#60a5fa" opacity="0.22" filter="url(#softGlow)"/>
  <circle cx="92" cy="112" r="122" fill="#a78bfa" opacity="0.18" filter="url(#softGlow)"/>

  <g>
    <rect x="122" y="90" width="338" height="250" rx="24" fill="url(#panelGrad)" stroke="rgba(255,255,255,0.08)"/>
    <rect x="142" y="108" width="132" height="18" rx="9" fill="#121c2d"/>
    <circle cx="160" cy="117" r="6" fill="#ff7070"/>
    <circle cx="179" cy="117" r="6" fill="#f8c75b"/>
    <circle cx="198" cy="117" r="6" fill="#52d39a"/>

    <g>
      <text x="158" y="178" fill="#a5b4c9" font-size="12" font-family="Arial, sans-serif" letter-spacing="2">REVENUE</text>
      <text x="158" y="218" fill="#f8fbff" font-size="38" font-weight="700" font-family="Arial, sans-serif">$84.6K</text>
    </g>

    <g transform="translate(305 148)">
      <rect x="0" y="42" width="14" height="54" rx="7" fill="url(#barGrad)" opacity="0.86"/>
      <rect x="20" y="28" width="14" height="68" rx="7" fill="url(#barGrad)" opacity="0.9"/>
      <rect x="40" y="14" width="14" height="82" rx="7" fill="url(#barGrad)" opacity="0.95"/>
      <rect x="60" y="30" width="14" height="66" rx="7" fill="url(#barGrad)" opacity="0.88"/>
      <rect x="80" y="0" width="14" height="96" rx="7" fill="url(#barGrad)"/>
      <rect x="100" y="-14" width="14" height="110" rx="7" fill="url(#barGrad)"/>
    </g>

    <g>
      <line x1="146" y1="262" x2="421" y2="262" stroke="rgba(255,255,255,0.08)"/>
      <text x="158" y="292" fill="#a5b4c9" font-size="12" font-family="Arial, sans-serif" letter-spacing="2">GROWTH</text>
      <text x="158" y="322" fill="#f8fbff" font-size="24" font-weight="700" font-family="Arial, sans-serif">+24.8%</text>
      <rect x="324" y="285" width="88" height="26" rx="13" fill="rgba(82,211,154,0.15)"/>
      <text x="344" y="303" fill="#7ef0b5" font-size="12" font-weight="700" font-family="Arial, sans-serif">▲ 18.4%</text>
    </g>
  </g>

  <g>
    <rect x="448" y="116" width="122" height="70" rx="18" fill="rgba(15,23,42,0.86)" stroke="rgba(255,255,255,0.08)"/>
    <text x="468" y="144" fill="#a5b4c9" font-size="10" font-family="Arial, sans-serif" letter-spacing="2">ENGAGEMENT</text>
    <text x="468" y="170" fill="#f8fbff" font-size="26" font-weight="700" font-family="Arial, sans-serif">92%</text>
  </g>

  <g>
    <rect x="82" y="300" width="122" height="70" rx="18" fill="rgba(15,23,42,0.86)" stroke="rgba(255,255,255,0.08)"/>
    <text x="103" y="328" fill="#a5b4c9" font-size="10" font-family="Arial, sans-serif" letter-spacing="2">LIVE USERS</text>
    <text x="103" y="354" fill="#f8fbff" font-size="26" font-weight="700" font-family="Arial, sans-serif">3.2k</text>
  </g>
</svg>
